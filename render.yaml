services:
  - type: web
    name: expense-tracker-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # One proxy (Render's load balancer) sits in front of the app.
      - key: TRUST_PROXY
        value: "1"
      # Random signing key generated by Render; never committed to the repo.
      - key: JWT_SECRET
        generateValue: true
